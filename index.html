<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SUPER MARIO BROS. — HTML5</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    overflow: hidden; touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #5c94fc;
    box-shadow: 0 0 40px rgba(0,0,0,.8);
  }
  #hint {
    position: fixed; left: 8px; bottom: 6px; color: #888;
    font: 11px/1.4 monospace; user-select: none; pointer-events: none;
  }
  /* touch controls (only on touch devices) */
  #pad { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between;
         padding: 10px 14px; pointer-events: none; }
  #pad .grp { display: flex; gap: 10px; pointer-events: auto; }
  #pad button {
    width: 58px; height: 58px; border-radius: 10px; border: 2px solid #666;
    background: rgba(255,255,255,.14); color: #ddd; font: 16px monospace;
    -webkit-user-select: none; user-select: none;
  }
  #pad button:active { background: rgba(255,255,255,.3); }
  @media (pointer: coarse) { #pad { display: flex; } #hint { display: none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="256" height="240"></canvas></div>
<div id="hint">arrows/WASD move &middot; space/Z jump &middot; shift/X run+fire &middot; down crouch &middot; enter start &middot; P pause &middot; M mute</div>
<div id="pad">
  <div class="grp">
    <button data-k="left">&#9664;</button>
    <button data-k="down">&#9660;</button>
    <button data-k="right">&#9654;</button>
  </div>
  <div class="grp">
    <button data-k="run">B</button>
    <button data-k="jump">A</button>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
